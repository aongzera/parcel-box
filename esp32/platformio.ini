; The ESP32-S3 bridge (product.md section 5). Build with `pio run -d esp32`
; from the repo root; CI does the same with secrets.example.h copied to
; include/secrets.h.

[env:esp32-s3-devkitc-1]
; Pinned: CI caches ~/.platformio keyed on this file's hash.
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Show the lines you type (pio device monitor).
monitor_echo = yes
; Our own code (src/) builds warning-free; the Arduino core is used as shipped.
; lib/bridge_link is plain C, held to -Werror by its PC tests (`make test`).
build_src_flags = -Wall -Wextra -Werror
